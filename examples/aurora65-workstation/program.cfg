FEATURES {
 CONDES: type=constructor, label=__CONSTRUCTOR_TABLE__, count=__CONSTRUCTOR_COUNT__, segment=ONCE;
 CONDES: type=destructor, label=__DESTRUCTOR_TABLE__, count=__DESTRUCTOR_COUNT__, segment=RODATA;
}
SYMBOLS {
 __STACKSIZE__: type=weak, value=$0800;
 __STACKSTART__: type=weak, value=$4000;
 __ZPSTART__: type=weak, value=$0000;
}
MEMORY {
 ZP: start=$0000, size=$0100, type=rw, file="";
 RAM: start=$0200, size=$3E00, type=rw, file="";
 ROM: start=$8000, size=$7FFA, type=ro, file=%O, fill=yes;
 VECTORS: start=$FFFA, size=$0006, type=ro, file=%O;
}
SEGMENTS {
 ZEROPAGE: load=ZP, type=zp;
 STARTUP: load=ROM, type=ro;
 LOWCODE: load=ROM, type=ro, optional=yes;
 ONCE: load=ROM, type=ro, optional=yes;
 CODE: load=ROM, type=ro;
 RODATA: load=ROM, type=ro;
 DATA: load=RAM, type=rw;
 BSS: load=RAM, type=bss, define=yes;
 VECTORS: load=VECTORS, type=ro;
}
