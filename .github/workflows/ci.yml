name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# Cancel superseded runs on a branch, but never on main.
#
# On a branch only the tip matters, so cancelling saves minutes and costs
# nothing. On main every commit is a landing, and cancelling means it never gets
# a verdict at all. Several sessions push here, sometimes minutes apart, and on
# 2026-08-09 six of twenty consecutive runs were cancelled — including the two
# commits either side of a break that left main unable to import. The run that
# would have said so was killed by the next push.
#
# `cancel-in-progress` takes an expression, so this is one condition rather than
# two workflows.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The sibling repositories fifteen cross-repo gates consume. Without them
      # those gates skipped on every run since they were written, and a skip is
      # indistinguishable from a pass in the summary line — the same defect that
      # let the stc12 extension ship eight opcodes short for five days. The sweep
      # is test/CROSS-REPO-GATE-AUDIT.md; the guard that now FAILS instead of
      # skipping when these are absent is test/helpers/siblings.mjs.
      #
      # Pinned by revision, not tracked to a branch: the gates must run, but this
      # repo's verdict must not float with another repo's HEAD. Both are ours and
      # public (bw-board MIT, bw-circuit-ui MPL-2.0). Keep these `ref:` values
      # equal to test/fixtures/siblings.json — a test asserts exactly that.
      #
      # THE REF MUST BE THE FULL 40-CHARACTER SHA. actions/checkout recognises a
      # commit only at full length; anything shorter it treats as a branch or tag
      # and runs `git fetch origin +refs/heads/<ref>*:...`, which matches nothing
      # and exits 1. These steps carried 7-character abbreviations from 90391a6
      # (2026-08-23 12:00) and every run on main failed HERE, at step two — so
      # lint, the whole suite, the mutation prover and the build did not run at
      # all for seven consecutive commits. The change that did it was the fix for
      # "fifteen cross-repo gates skip in CI"; it replaced fifteen silent skips
      # with one loud blackout. gate-integrity now asserts the length.
      - name: Check out bw-board (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/bw-board
          ref: 4ae89b520d1f16ffb9778648e7ec271c4735b073
          path: siblings/bw-board

      - name: Check out bw-circuit-ui (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/bw-circuit-ui
          ref: 14efc75d47df9d0671db43405c315ebaf5a23023
          path: siblings/bw-circuit-ui

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # bw-board drives real MCU cores through these. Without them every gate that
      # boots a board fails on a missing package rather than on a real defect —
      # which is what a local run without them looks like, and it is not a signal.
      #
      # EXACT VERSIONS, NOT RANGES. `--no-save` means these two never enter
      # package-lock.json, so they are the one install in this workflow that
      # `npm ci`'s integrity check does not cover. Carrying `^0.21.0` here meant
      # the MCU cores every board gate runs on could change under a green run
      # with nothing recording which build was tested — the same shape as
      # fetching a branch and reporting it as a pin. npm forbids republishing a
      # version, so an exact version IS the immutable object; the integrity
      # hashes below are what it resolved to when this was pinned (2026-08-24),
      # recorded so drift is checkable rather than merely unlikely.
      #   avr8js@0.21.0   sha512-kjFzxorERow5YFFV25ElhscG57TJqpT6M0m5GDDbXiMYoBmG6K99MQcq6AU1Ly4L+uB1g1o79dMmBNb5O+toxQ==
      #   rp2040js@1.3.3  sha512-6uE6/Ht8L654aF3fB8HS6ICmywzEq1KN71XZq45RR0BUs9SUitPoy+mySoLEHPso6mu2695RCS1hKnchRlGhMA==
      # bw-board's own package.json carries the ranges; keep these equal to what
      # they resolve to, and bump deliberately.
      - name: Install bw-board's runtime dependencies (exact, unlocked by --no-save)
        # INSIDE the sibling checkout: cortex-m0-machine.js deep-imports
        # rp2040js BY FILE PATH ('../node_modules/rp2040js/dist/esm/...')
        # because the package's exports map hides the core — a root-level
        # install satisfies bare 'rp2040js' imports but not that path, and
        # the F0 chain tests failed with ERR_MODULE_NOT_FOUND on 917a0fc
        # exactly there. Bare imports still resolve (node walks up).
        run: npm install --no-save avr8js@0.21.0 rp2040js@1.3.3
        working-directory: siblings/bw-board

      # arm-none-eabi-gcc is a stock apt package, so the Pico chain gate becomes
      # CI-runnable. The emu8051 chain deliberately does NOT: it needs an
      # emscripten build, hundreds of megabytes for two tests. That one is
      # disposition (c), developer-only, and its skip reason says so.
      - name: Install the ARM cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      # Before the tests, because the tests cannot see this: they run against a
      # checkout that has every committed file, so an import of a file that was
      # never committed only fails for the next person to clone. It happened on
      # 2026-08-09 and main was broken until someone tried a fresh clone.
      - name: Every import resolves to a committed file
        run: node scripts/check-staged-imports.mjs --tracked

      - name: Lint
        run: npm run lint

      - name: Unit + VM tests
        run: npm test
        # Raised from 5: the cross-repo gates now actually run. Raised again to
        # 30 alongside the per-file --test-timeout, because gallery-e2e alone is
        # a four-minute file on a developer box (measured 242 s, 45/45) and this
        # runner is slower; 20 left no room for the rest of the suite behind it.
        timeout-minutes: 30
        env:
          BW_BOARD: ${{ github.workspace }}/siblings/bw-board
          BW_CIRCUIT_UI: ${{ github.workspace }}/siblings/bw-circuit-ui

      # A gate nobody has seen fail is a gate nobody should trust, and this one
      # in particular was green for five days while the extension lite ships was
      # eight opcodes short. This re-introduces that exact defect and seven
      # others, requires the gate to go red for each, and restores the tree.
      # It runs in CI rather than on demand because the failure it guards
      # against is specifically "works on the machine that has both checkouts".
      - name: Conformance gate is mutation-proven
        run: node scripts/mutation-prove-conformance.mjs
        # Twenty-seven mutations, each a full run of five gates, one of which boots
        # the real VM. The headroom is deliberate so a slow runner reports a
        # mutation that was missed rather than a timeout — a timeout here says
        # nothing about whether the gates can fail, which is the one thing this
        # step exists to answer.
        timeout-minutes: 25
        # The siblings, for the same reason the test step has them. Without these
        # the prover reported "bw-board: not present" and then "the gate is
        # already red before any mutation" — which is true, and says nothing about
        # whether any gate can fail. This step's own comment above says the failure
        # it guards is "works on the machine that has both checkouts", so it has to
        # be a machine that has both checkouts.
        env:
          BW_BOARD: ${{ github.workspace }}/siblings/bw-board
          BW_CIRCUIT_UI: ${{ github.workspace }}/siblings/bw-circuit-ui

      - name: Build
        run: npm run build

  browser:
    name: Browser render tests (WebGL)
    runs-on: ubuntu-latest
    # Headless-WebGL rendering can be environment-flaky; keep it visible but
    # don't let it red the whole workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render tests
        run: npm run test:browser

  pages:
    name: Publish the live editor to GitHub Pages
    # Only from main, and only once the suite is green — a broken build must not
    # replace a working page. The old flow was a manual `npm run deploy` to the
    # gh-pages branch, which is why the site sat a year behind main.
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
