name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# Cancel superseded runs on a branch, but never on main.
#
# On a branch only the tip matters, so cancelling saves minutes and costs
# nothing. On main every commit is a landing, and cancelling means it never gets
# a verdict at all. Several sessions push here, sometimes minutes apart, and on
# 2026-08-09 six of twenty consecutive runs were cancelled — including the two
# commits either side of a break that left main unable to import. The run that
# would have said so was killed by the next push.
#
# `cancel-in-progress` takes an expression, so this is one condition rather than
# two workflows.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The sibling repositories fifteen cross-repo gates consume. Without them
      # those gates skipped on every run since they were written, and a skip is
      # indistinguishable from a pass in the summary line — the same defect that
      # let the stc12 extension ship eight opcodes short for five days. The sweep
      # is test/CROSS-REPO-GATE-AUDIT.md; the guard that now FAILS instead of
      # skipping when these are absent is test/helpers/siblings.mjs.
      #
      # Pinned by revision, not tracked to a branch: the gates must run, but this
      # repo's verdict must not float with another repo's HEAD. Both are ours and
      # public (bw-board MIT, bw-circuit-ui MPL-2.0). Keep these `ref:` values
      # equal to test/fixtures/siblings.json — a test asserts exactly that.
      - name: Check out bw-board (pinned)
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/bw-board
          ref: 50c3bf7
          path: siblings/bw-board

      - name: Check out bw-circuit-ui (pinned)
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/bw-circuit-ui
          ref: d754cfc
          path: siblings/bw-circuit-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # bw-board drives real MCU cores through these. Without them every gate that
      # boots a board fails on a missing package rather than on a real defect —
      # which is what a local run without them looks like, and it is not a signal.
      - name: Install bw-board's runtime dependencies
        run: npm install --no-save avr8js@^0.21.0 rp2040js@^1.3.3

      # arm-none-eabi-gcc is a stock apt package, so the Pico chain gate becomes
      # CI-runnable. The emu8051 chain deliberately does NOT: it needs an
      # emscripten build, hundreds of megabytes for two tests. That one is
      # disposition (c), developer-only, and its skip reason says so.
      - name: Install the ARM cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      # Before the tests, because the tests cannot see this: they run against a
      # checkout that has every committed file, so an import of a file that was
      # never committed only fails for the next person to clone. It happened on
      # 2026-08-09 and main was broken until someone tried a fresh clone.
      - name: Every import resolves to a committed file
        run: node scripts/check-staged-imports.mjs --tracked

      - name: Lint
        run: npm run lint

      - name: Unit + VM tests
        run: npm test
        # Raised from 5: the cross-repo gates now actually run.
        timeout-minutes: 20
        env:
          BW_BOARD: ${{ github.workspace }}/siblings/bw-board
          BW_CIRCUIT_UI: ${{ github.workspace }}/siblings/bw-circuit-ui

      # A gate nobody has seen fail is a gate nobody should trust, and this one
      # in particular was green for five days while the extension lite ships was
      # eight opcodes short. This re-introduces that exact defect and seven
      # others, requires the gate to go red for each, and restores the tree.
      # It runs in CI rather than on demand because the failure it guards
      # against is specifically "works on the machine that has both checkouts".
      - name: Conformance gate is mutation-proven
        run: node scripts/mutation-prove-conformance.mjs
        # Thirteen mutations, each a full run of the three gates, one of which
        # boots the real VM. ~4 minutes; the headroom is deliberate so a slow
        # runner reports a mutation that was missed rather than a timeout.
        timeout-minutes: 12

      - name: Build
        run: npm run build

  browser:
    name: Browser render tests (WebGL)
    runs-on: ubuntu-latest
    # Headless-WebGL rendering can be environment-flaky; keep it visible but
    # don't let it red the whole workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render tests
        run: npm run test:browser

  pages:
    name: Publish the live editor to GitHub Pages
    # Only from main, and only once the suite is green — a broken build must not
    # replace a working page. The old flow was a manual `npm run deploy` to the
    # gh-pages branch, which is why the site sat a year behind main.
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
